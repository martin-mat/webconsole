# Fork-only: the PR checks of main.yml on this branch.
name: Verify (fork)
on:
  push:
    branches: [verify-redact]
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/build.yml@f920a09dd4b3fca4d6a40f36bb75f3cd2217bd59 # v0.0.34
    with:
      branch_name: ${{ github.ref }}
  static-analysis:
    permissions:
      contents: read
      security-events: write
      actions: read
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/static-analysis.yml@f920a09dd4b3fca4d6a40f36bb75f3cd2217bd59 # v0.0.34
    with:
      staticcheck_version: 'v0.8.1'
      branch_name: ${{ github.ref }}
  lint:
    permissions:
      contents: read
      checks: write
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/lint.yml@f920a09dd4b3fca4d6a40f36bb75f3cd2217bd59 # v0.0.34
    with:
      golangci_lint_version: 'v2.13.2'
      branch_name: ${{ github.ref }}
  license-check:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/license-check.yml@f920a09dd4b3fca4d6a40f36bb75f3cd2217bd59 # v0.0.34
    with:
      branch_name: ${{ github.ref }}
  unit-tests:
    permissions:
      contents: read
      checks: write
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/unit-test.yml@f920a09dd4b3fca4d6a40f36bb75f3cd2217bd59 # v0.0.34
    with:
      branch_name: ${{ github.ref }}
